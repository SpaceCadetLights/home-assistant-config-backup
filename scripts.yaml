studio_all_lights_on:
  alias: Studio On
  description: Turn on upstairs/studio lights (excludes bathroom mirror + workshop — motion only).
  icon: mdi:lightbulb-group
  mode: single
  sequence:
    - action: light.turn_on
      target:
        entity_id:
          - light.build_space_lights
          - light.lounge_lights
          - light.trillium
          - light.front_right_lamp
          - light.bar_lights
          - light.outdoor_white_lights
    - action: switch.turn_on
      target:
        entity_id:
          - switch.desk_leds
          - switch.earth
          - switch.leg_lamp
          - switch.red_desk_lamp
          - switch.bar_lights
          - switch.outdoor_white_lights
          - switch.front_right_lamp

studio_all_lights_off:
  alias: Studio Off
  description: Turn off all studio lights including workshop; bathroom mirror stays motion-only.
  icon: mdi:lightbulb-group-off
  mode: single
  sequence:
    - action: light.turn_off
      target:
        entity_id:
          - light.build_space_lights
          - light.lounge_lights
          - light.workshop_lights
          - light.trillium
          - light.front_right_lamp
          - light.bar_lights
          - light.outdoor_white_lights
    - action: switch.turn_off
      target:
        entity_id:
          - switch.stage_lights_left
          - switch.stage_lights_right
          - switch.bar_lights
          - switch.dmx
          - switch.desk_leds
          - switch.earth
          - switch.leg_lamp
          - switch.front_right_lamp
          - switch.red_desk_lamp
          - switch.outdoor_white_lights
          - switch.basement_light
          - switch.3d_printer_light
          - switch.cnc_table_light
          - switch.laser_station_light
          - switch.paint_booth_light

studio_entry_toggle:
  alias: Studio Entry Toggle
  description: >-
    Toggle Studio On/Off. If turning off while Full Studio is playing, pause
    music; if turning on while Full Studio still has a track loaded (paused/idle),
    resume.
  icon: mdi:doorbell
  mode: single
  sequence:
    - variables:
        music: "{{ states('media_player.full_studio') }}"
    - choose:
        - conditions:
            - condition: state
              entity_id: light.studio_lights
              state: "on"
          sequence:
            - action: script.turn_on
              target:
                entity_id: script.studio_all_lights_off
            - if:
                - condition: template
                  value_template: "{{ music == 'playing' }}"
              then:
                - action: media_player.media_pause
                  target:
                    entity_id: media_player.full_studio
      default:
        - action: script.turn_on
          target:
            entity_id: script.studio_all_lights_on
        - if:
            - condition: template
              value_template: >-
                {{ music in ['paused', 'idle']
                   and state_attr('media_player.full_studio', 'media_content_id') not in [none, ''] }}
          then:
            - action: media_player.media_play
              target:
                entity_id: media_player.full_studio
