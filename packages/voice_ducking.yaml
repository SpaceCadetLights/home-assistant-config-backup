# When you talk to a voice satellite, briefly lower the volume of other
# music speakers, then fade them back when the assistant is done.
#
# Hardening (2026-08-02):
# - Keep a durable baseline snapshot; only clear store/baseline after volumes
#   verify back to ~target (prevents "store cleared, music still quiet").
# - Restore retries final volume_set; failed verify leaves store for watchdogs.
# - Orphan watchdog: idle + empty store + baseline + volumes still ducked → restore.
# - Playback desync watchdog: Full Studio "playing" but all members not → re-stream.
# - Never duck MA groups / Spotify / non-numeric volume; continue_on_error on sets.
# - from_json ONLY on states() (never script vars — HA auto-dicts those).
# - While ducked, Assist/UI volume_set updates the snapshot so restore lands on
#   the newly requested level (not the pre-duck snapshot).

input_text:
  voice_duck_store:
    name: Voice Duck Volume Store
    max: 255
    initial: ""
  voice_duck_baseline:
    name: Voice Duck Volume Baseline
    max: 255
    initial: ""

input_boolean:
  voice_duck_busy:
    name: Voice Duck Busy
    initial: off

script:
  voice_duck_apply:
    alias: Voice Duck - lower music
    mode: restart
    sequence:
      - variables:
          duck_factor: 0.45
          exclude:
            - media_player.home_assistant_voice_0aab68
            - media_player.home_assistant_voice_0aab68_media_player
      # If a prior duck left volumes low but cleared the store, heal first.
      - condition: template
        value_template: >-
          {{ states('input_text.voice_duck_store') in ['', 'unknown', 'unavailable'] }}
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {% set b = states('input_text.voice_duck_baseline') %}
                  {% if b in ['', 'unknown', 'unavailable'] %}false{% else %}
                  {% set d = b | from_json %}
                  {% set ns = namespace(low=0, n=0) %}
                  {% if d is mapping %}
                    {% for e in d if d[e] is number %}
                      {% set ns.n = ns.n + 1 %}
                      {% set cur = state_attr(e, 'volume_level') %}
                      {% if cur is number and cur < (d[e] | float(0.3) * 0.55) %}
                        {% set ns.low = ns.low + 1 %}
                      {% endif %}
                    {% endfor %}
                  {% endif %}
                  {{ ns.n > 0 and ns.low == ns.n }}
                  {% endif %}
            sequence:
              - service: input_text.set_value
                target:
                  entity_id: input_text.voice_duck_store
                data:
                  value: "{{ states('input_text.voice_duck_baseline') }}"
              - service: script.voice_duck_restore
              - delay:
                  milliseconds: 400
      - variables:
          targets: >-
            {% set ns = namespace(t=[]) %}
            {% for s in states.media_player
                  if s.state == 'playing'
                  and s.entity_id not in exclude
                  and not s.entity_id.startswith('media_player.spotify_')
                  and (s.attributes.mass_player_type | default('')) != 'group'
                  and s.attributes.volume_level is number %}
              {% set ns.t = ns.t + [s.entity_id] %}
            {% endfor %}
            {{ ns.t }}
      - condition: template
        value_template: "{{ targets | length > 0 }}"
      - condition: template
        value_template: >-
          {{ states('input_text.voice_duck_store') in ['', 'unknown', 'unavailable'] }}
      - variables:
          store_json: >-
            {% set ns = namespace(items=[]) %}
            {% for e in targets %}
              {% set v = state_attr(e, 'volume_level') %}
              {% if v is number %}
                {% set ns.items = ns.items + [(e, v)] %}
              {% endif %}
            {% endfor %}
            {{ dict(ns.items) | to_json }}
      - condition: template
        value_template: "{{ targets | length > 0 and store_json not in ['', '{}', 'null'] }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.voice_duck_store
        data:
          value: "{{ store_json }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.voice_duck_baseline
        data:
          value: "{{ store_json }}"
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.voice_duck_busy
      - repeat:
          for_each: "{{ targets }}"
          sequence:
            - continue_on_error: true
              service: media_player.volume_set
              target:
                entity_id: "{{ repeat.item }}"
              data:
                volume_level: >-
                  {{ ([0.01, (state_attr(repeat.item, 'volume_level') | float(0.3) * duck_factor)] | max) | round(3) }}
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.voice_duck_busy

  voice_duck_restore:
    alias: Voice Duck - restore music
    mode: restart
    sequence:
      - condition: template
        value_template: >-
          {{ states('input_text.voice_duck_store') not in ['', 'unknown', 'unavailable'] }}
      - variables:
          keys: >-
            {% set d = states('input_text.voice_duck_store') | from_json %}
            {% set ns = namespace(k=[]) %}
            {% if d is mapping %}
              {% for e in d %}
                {% if d[e] is number and not e.startswith('media_player.spotify_') %}
                  {% set ns.k = ns.k + [e] %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {{ ns.k }}
      - condition: template
        value_template: "{{ keys | length > 0 }}"
      # Already at the (possibly voice-updated) target — just clear, no fade dip.
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {% set d = states('input_text.voice_duck_store') | from_json %}
                  {% set ns = namespace(ok=0, n=0) %}
                  {% if d is mapping %}
                    {% for e in d if d[e] is number %}
                      {% set ns.n = ns.n + 1 %}
                      {% set cur = state_attr(e, 'volume_level') %}
                      {% set tgt = d[e] | float(0.3) %}
                      {% if cur is number and cur >= (tgt * 0.85) %}
                        {% set ns.ok = ns.ok + 1 %}
                      {% endif %}
                    {% endfor %}
                  {% endif %}
                  {{ ns.n > 0 and ns.ok == ns.n }}
            sequence:
              - service: input_text.set_value
                target:
                  entity_id: input_text.voice_duck_store
                data:
                  value: ""
              - service: input_text.set_value
                target:
                  entity_id: input_text.voice_duck_baseline
                data:
                  value: ""
          - conditions: []
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.voice_duck_busy
              # Fade up
              - repeat:
                  for_each: "{{ keys }}"
                  sequence:
                    - continue_on_error: true
                      service: media_player.volume_set
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        volume_level: >-
                          {{ ((states('input_text.voice_duck_store') | from_json)[repeat.item] | float(0.3) * 0.7) | round(3) }}
              - delay:
                  milliseconds: 180
              - repeat:
                  for_each: "{{ keys }}"
                  sequence:
                    - continue_on_error: true
                      service: media_player.volume_set
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        volume_level: >-
                          {{ ((states('input_text.voice_duck_store') | from_json)[repeat.item] | float(0.3) * 0.87) | round(3) }}
              - delay:
                  milliseconds: 180
              # Final target — retry so flaky AirPlay sets still land
              - repeat:
                  count: 3
                  sequence:
                    - repeat:
                        for_each: "{{ keys }}"
                        sequence:
                          - continue_on_error: true
                            service: media_player.volume_set
                            target:
                              entity_id: "{{ repeat.item }}"
                            data:
                              volume_level: >-
                                {{ (states('input_text.voice_duck_store') | from_json)[repeat.item] | float(0.3) }}
                    - delay:
                        milliseconds: 250
              - delay:
                  milliseconds: 300
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.voice_duck_busy
              # Only clear after volumes actually look restored
              - choose:
                  - conditions:
                      - condition: template
                        value_template: >-
                          {% set d = states('input_text.voice_duck_store') | from_json %}
                          {% set ns = namespace(ok=0, n=0) %}
                          {% if d is mapping %}
                            {% for e in d if d[e] is number %}
                              {% set ns.n = ns.n + 1 %}
                              {% set cur = state_attr(e, 'volume_level') %}
                              {% set tgt = d[e] | float(0.3) %}
                              {% if cur is number and cur >= (tgt * 0.85) %}
                                {% set ns.ok = ns.ok + 1 %}
                              {% endif %}
                            {% endfor %}
                          {% endif %}
                          {{ ns.n > 0 and ns.ok == ns.n }}
                    sequence:
                      - service: input_text.set_value
                        target:
                          entity_id: input_text.voice_duck_store
                        data:
                          value: ""
                      - service: input_text.set_value
                        target:
                          entity_id: input_text.voice_duck_baseline
                        data:
                          value: ""
                  - conditions: []
                    sequence:
                      - service: system_log.write
                        data:
                          level: warning
                          message: >-
                            Voice duck restore incomplete — keeping snapshot for watchdog retry.
                            store={{ states('input_text.voice_duck_store') }}

  voice_duck_force_clear:
    alias: Voice Duck - force clear stuck duck
    mode: single
    sequence:
      # Prefer store; fall back to durable baseline if store was wiped early.
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ states('input_text.voice_duck_store') in ['', 'unknown', 'unavailable']
                     and states('input_text.voice_duck_baseline') not in ['', 'unknown', 'unavailable'] }}
            sequence:
              - service: input_text.set_value
                target:
                  entity_id: input_text.voice_duck_store
                data:
                  value: "{{ states('input_text.voice_duck_baseline') }}"
      - service: script.voice_duck_restore
      - delay:
          milliseconds: 800
      # Emergency last shove if still not cleared
      - condition: template
        value_template: >-
          {{ states('input_text.voice_duck_store') not in ['', 'unknown', 'unavailable'] }}
      - variables:
          keys: >-
            {% set d = states('input_text.voice_duck_store') | from_json %}
            {% set ns = namespace(k=[]) %}
            {% if d is mapping %}
              {% for e in d if d[e] is number %}
                {% set ns.k = ns.k + [e] %}
              {% endfor %}
            {% endif %}
            {{ ns.k }}
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.voice_duck_busy
      - repeat:
          count: 2
          sequence:
            - repeat:
                for_each: "{{ keys }}"
                sequence:
                  - continue_on_error: true
                    service: media_player.volume_set
                    target:
                      entity_id: "{{ repeat.item }}"
                    data:
                      volume_level: >-
                        {{ (states('input_text.voice_duck_store') | from_json)[repeat.item] | float(0.3) }}
            - delay:
                milliseconds: 300
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.voice_duck_busy
      - service: input_text.set_value
        target:
          entity_id: input_text.voice_duck_store
        data:
          value: ""
      - service: input_text.set_value
        target:
          entity_id: input_text.voice_duck_baseline
        data:
          value: ""

automation:
  - id: voice_duck_start
    alias: Voice - duck music when talking
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - assist_satellite.home_assistant_voice_0aab68_assist_satellite
          - assist_satellite.assist_microphone
    condition:
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none
             and trigger.from_state.state == 'idle'
             and trigger.to_state.state not in ['idle', 'unavailable', 'unknown'] }}
    action:
      - service: script.voice_duck_apply

  - id: voice_duck_end
    alias: Voice - restore music after talking
    mode: queued
    max: 3
    trigger:
      - platform: state
        entity_id:
          - assist_satellite.home_assistant_voice_0aab68_assist_satellite
          - assist_satellite.assist_microphone
        to: "idle"
        for:
          seconds: 2
    condition:
      - condition: template
        value_template: >-
          {{ states('input_text.voice_duck_store') not in ['', 'unknown', 'unavailable'] }}
      - condition: state
        entity_id: assist_satellite.home_assistant_voice_0aab68_assist_satellite
        state: idle
      - condition: state
        entity_id: assist_satellite.assist_microphone
        state: idle
    action:
      - service: script.voice_duck_restore

  # While ducked, rewrite snapshot when Assist/UI changes volume so restore
  # returns to the new level instead of the pre-duck snapshot.
  - id: voice_duck_track_volume
    alias: Voice - update duck snapshot on volume change
    mode: queued
    max: 20
    trigger:
      - platform: event
        event_type: call_service
        event_data:
          domain: media_player
          service: volume_set
        id: set
      - platform: event
        event_type: call_service
        event_data:
          domain: media_player
          service: volume_up
        id: bump
      - platform: event
        event_type: call_service
        event_data:
          domain: media_player
          service: volume_down
        id: bump
    condition:
      - condition: state
        entity_id: input_boolean.voice_duck_busy
        state: "off"
      - condition: template
        value_template: >-
          {{ states('input_text.voice_duck_store') not in ['', 'unknown', 'unavailable'] }}
    action:
      - variables:
          raw: >-
            {% set sd = trigger.event.data.service_data | default({}) %}
            {% set tg = trigger.event.data.target | default({}) %}
            {% set t = sd.get('entity_id', tg.get('entity_id', [])) %}
            {% if t is string %}{% set t = [t] %}{% endif %}
            {% if t is none %}{% set t = [] %}{% endif %}
            {{ t }}
      - choose:
          - conditions:
              - condition: trigger
                id: bump
            sequence:
              - delay:
                  milliseconds: 350
      - variables:
          new_json: >-
            {% set d = states('input_text.voice_duck_store') | from_json %}
            {% set group = 'media_player.full_studio' %}
            {% set apply_all = group in raw %}
            {% set sd = trigger.event.data.service_data | default({}) %}
            {% set ns = namespace(items=[], changed=false) %}
            {% if d is mapping %}
              {% for e in d if d[e] is number %}
                {% if apply_all or e in raw %}
                  {% if trigger.id == 'set' and sd.get('volume_level') is not none %}
                    {% set v = sd.get('volume_level') | float(d[e]) %}
                  {% else %}
                    {% set cur = state_attr(e, 'volume_level') %}
                    {% set v = cur if cur is number else d[e] %}
                  {% endif %}
                  {% set ns.items = ns.items + [(e, (v | float(d[e]) | round(3)))] %}
                  {% set ns.changed = true %}
                {% else %}
                  {% set ns.items = ns.items + [(e, d[e])] %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {{ dict(ns.items) | to_json if ns.changed else '' }}
      - condition: template
        value_template: "{{ new_json not in ['', '{}', 'null'] }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.voice_duck_store
        data:
          value: "{{ new_json }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.voice_duck_baseline
        data:
          value: "{{ new_json }}"

  - id: voice_duck_watchdog_idle
    alias: Voice - duck watchdog (idle leftover)
    mode: single
    trigger:
      - platform: time_pattern
        seconds: "/15"
      - platform: homeassistant
        event: start
    condition:
      - condition: template
        value_template: >-
          {{ states('input_text.voice_duck_store') not in ['', 'unknown', 'unavailable'] }}
      - condition: state
        entity_id: assist_satellite.home_assistant_voice_0aab68_assist_satellite
        state: idle
      - condition: state
        entity_id: assist_satellite.assist_microphone
        state: idle
    action:
      - service: script.voice_duck_force_clear

  - id: voice_duck_watchdog_max_age
    alias: Voice - duck watchdog (max age)
    mode: single
    trigger:
      - platform: state
        entity_id: input_text.voice_duck_store
        for:
          seconds: 60
    condition:
      - condition: template
        value_template: >-
          {{ states('input_text.voice_duck_store') not in ['', 'unknown', 'unavailable'] }}
    action:
      - service: system_log.write
        data:
          level: warning
          message: "Voice duck store still set after 60s — force restoring music volume."
      - service: script.voice_duck_force_clear

  # Catches the failure mode we hit: store wiped, volumes still at ~45%.
  - id: voice_duck_watchdog_orphan
    alias: Voice - duck watchdog (orphaned low volume)
    mode: single
    trigger:
      - platform: time_pattern
        seconds: "/20"
    condition:
      - condition: state
        entity_id: assist_satellite.home_assistant_voice_0aab68_assist_satellite
        state: idle
      - condition: state
        entity_id: assist_satellite.assist_microphone
        state: idle
      - condition: template
        value_template: >-
          {{ states('input_text.voice_duck_store') in ['', 'unknown', 'unavailable'] }}
      - condition: template
        value_template: >-
          {% set b = states('input_text.voice_duck_baseline') %}
          {% if b in ['', 'unknown', 'unavailable'] %}false{% else %}
          {% set d = b | from_json %}
          {% set ns = namespace(low=0, n=0) %}
          {% if d is mapping %}
            {% for e in d if d[e] is number %}
              {% set ns.n = ns.n + 1 %}
              {% set cur = state_attr(e, 'volume_level') %}
              {% if cur is number and cur < (d[e] | float(0.3) * 0.55) %}
                {% set ns.low = ns.low + 1 %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {{ ns.n > 0 and ns.low == ns.n }}
          {% endif %}
    action:
      - service: system_log.write
        data:
          level: warning
          message: "Voice duck orphaned low volumes — restoring from baseline."
      - service: input_text.set_value
        target:
          entity_id: input_text.voice_duck_store
        data:
          value: "{{ states('input_text.voice_duck_baseline') }}"
      - service: script.voice_duck_force_clear

  # Safety: busy flag must not stick if a restart cancelled turn_off.
  - id: voice_duck_busy_watchdog
    alias: Voice - duck busy flag watchdog
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.voice_duck_busy
        to: "on"
        for:
          seconds: 8
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.voice_duck_busy

  # Full Studio says playing but every member speaker stopped → re-stream current track.
  - id: full_studio_member_desync_recover
    alias: Full Studio - recover silent member desync
    mode: single
    trigger:
      - platform: state
        entity_id: media_player.full_studio
        to: "playing"
        for:
          seconds: 25
      - platform: time_pattern
        seconds: "/30"
    condition:
      - condition: state
        entity_id: media_player.full_studio
        state: playing
      - condition: template
        value_template: >-
          {% set members = state_attr('media_player.full_studio', 'group_members') | default([]) %}
          {% if members is string %}
            {% set members = [members] %}
          {% endif %}
          {% set ns = namespace(playing=0, n=0) %}
          {% for e in members %}
            {% set ns.n = ns.n + 1 %}
            {% if states(e) == 'playing' %}
              {% set ns.playing = ns.playing + 1 %}
            {% endif %}
          {% endfor %}
          {{ ns.n > 0 and ns.playing == 0 }}
      - condition: template
        value_template: >-
          {{ state_attr('media_player.full_studio', 'media_content_id') not in [none, ''] }}
    action:
      - service: system_log.write
        data:
          level: warning
          message: >-
            Full Studio playing but all members idle — re-streaming
            {{ state_attr('media_player.full_studio', 'media_content_id') }}.
      - continue_on_error: true
        service: music_assistant.play_media
        target:
          entity_id: media_player.full_studio
        data:
          media_id: "{{ state_attr('media_player.full_studio', 'media_content_id') }}"
          media_type: track
          enqueue: play
