# Package: basement_lighting
# Workshop/Basement motion lighting.
# Motion: binary_sensor.motion_sensor_2_occupancy (Workshop)
# Lights: light.workshop_lights group (basement / 3D / CNC / laser / paint)
#
# Note: switch.turn_on with area_id basement does NOT work on these
# devices (Switch as X / light entities). Always use light.workshop_lights.

automation:

  - id: 'pkg_basement_lights_on'
    alias: 'lighting.basement.motion_lights_on'
    description: 'Turn on workshop lights when Workshop motion detects occupancy.'
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.motion_sensor_2_occupancy
        to: 'on'
    conditions: []
    actions:
      - action: light.turn_on
        target:
          entity_id: light.workshop_lights

  - id: 'pkg_basement_lights_off'
    alias: 'lighting.basement.motion_lights_off'
    description: 'Turn off workshop lights after 5 minutes of no occupancy.'
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.motion_sensor_2_occupancy
        to: 'off'
        for:
          minutes: 5
    conditions: []
    actions:
      - action: light.turn_off
        target:
          entity_id: light.workshop_lights
