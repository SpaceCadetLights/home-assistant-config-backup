# Package: nebula_voice
# Voice + GUI control for "Nebula" (branded WLED lighting).
# Active device is input_text.nebula_target (default light.trillium).
# Space Cadets Nebula card + Assist both drive that selection.

input_text:
  nebula_target:
    name: Nebula Target Light
    max: 255
    initial: "light.trillium"

script:
  nebula_apply:
    alias: Nebula Apply
    description: >-
      Drive the currently selected Nebula WLED device (see input_text.nebula_target
      / Space Cadets Nebula picker). Sets any combination of power, effect, color
      palette, speed and distortion (intensity). Use this whenever someone asks
      to control Nebula lighting.
    fields:
      power:
        description: Turn Nebula on or off
        example: "on"
      effect:
        description: WLED effect name (fuzzy matched, e.g. Fluid)
        example: Fluid
      palette:
        description: WLED color palette name (fuzzy matched, e.g. Aurora)
        example: Aurora
      speed:
        description: Speed 0-255
        example: 10
      distortion:
        description: Distortion / intensity 0-255
        example: 15
    mode: queued
    max: 10
    sequence:
      # ---- Active Nebula device (Space Cadets picker writes this helper) ----
      - variables:
          nebula_light: >-
            {% set t = states('input_text.nebula_target') | default('', true) | string | trim %}
            {{ t if t.startswith('light.') else 'light.trillium' }}
      - variables:
          nebula_base: "{{ nebula_light.split('.')[1] }}"
          nebula_lights:
            - "{{ nebula_light }}"
          nebula_speed_numbers:
            - "number.{{ nebula_light.split('.')[1] }}_speed"
          nebula_distort_numbers:
            - "number.{{ nebula_light.split('.')[1] }}_intensity"
          nebula_palette_selects:
            - "select.{{ nebula_light.split('.')[1] }}_color_palette"
      # ---- Power ----
      - if: "{{ (power | default('') | string | lower) in ['on','true','1'] }}"
        then:
          - service: light.turn_on
            target:
              entity_id: "{{ nebula_lights }}"
      - if: "{{ (power | default('') | string | lower) in ['off','false','0'] }}"
        then:
          - service: light.turn_off
            target:
              entity_id: "{{ nebula_lights }}"
      # ---- Effect (fuzzy match against the active device's effect_list) ----
      - if: "{{ (effect | default('') | string | trim) != '' }}"
        then:
          - variables:
              nebula_effect: >-
                {% set opts = state_attr(nebula_lights[0], 'effect_list') or [] %}
                {% set want = effect | string | lower | trim %}
                {% set ns = namespace(v=none) %}
                {%- for o in opts if ns.v is none and (o | lower) == want %}{% set ns.v = o %}{% endfor %}
                {%- for o in opts if ns.v is none and want in (o | lower) %}{% set ns.v = o %}{% endfor %}
                {{- ns.v if ns.v is not none else effect }}
          - service: light.turn_on
            target:
              entity_id: "{{ nebula_lights }}"
            data:
              effect: "{{ nebula_effect | trim }}"
      # ---- Palette (fuzzy match; and make sure it's actually visible) ----
      - if: "{{ (palette | default('') | string | trim) != '' }}"
        then:
          - variables:
              nebula_pal: >-
                {% set opts = state_attr(nebula_palette_selects[0], 'options') or [] %}
                {% set want = palette | string | lower | trim %}
                {% set ns = namespace(v=none) %}
                {%- for o in opts if ns.v is none and (o | lower) == want %}{% set ns.v = o %}{% endfor %}
                {%- for o in opts if ns.v is none and want in (o | lower) %}{% set ns.v = o %}{% endfor %}
                {{- ns.v if ns.v is not none else palette }}
          - service: select.select_option
            target:
              entity_id: "{{ nebula_palette_selects }}"
            data:
              option: "{{ nebula_pal | trim }}"
          # A WLED palette is only visible when the light is on AND the running
          # effect actually uses the palette. If the caller didn't ask for a
          # specific effect and the current effect ignores palettes (Solid/off),
          # turn on and switch to the palette-rendering "Palette" effect.
          - if: "{{ (power | default('') | string | lower) not in ['off','false','0'] }}"
            then:
              - service: light.turn_on
                target:
                  entity_id: "{{ nebula_lights }}"
              - if: >-
                  {{ (effect | default('') | string | trim) == ''
                     and (state_attr(nebula_lights[0], 'effect') | string) in ['Solid', 'None', 'none', ''] }}
                then:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ nebula_lights }}"
                    data:
                      effect: "Palette"
      # ---- Speed ----
      - if: "{{ (speed | default('') | string | trim) != '' }}"
        then:
          - service: number.set_value
            target:
              entity_id: "{{ nebula_speed_numbers }}"
            data:
              value: "{{ speed | int }}"
      # ---- Distortion (WLED intensity) ----
      - if: "{{ (distortion | default('') | string | trim) != '' }}"
        then:
          - service: number.set_value
            target:
              entity_id: "{{ nebula_distort_numbers }}"
            data:
              value: "{{ distortion | int }}"

intent_script:
  NebulaPower:
    description: Turn the selected Nebula WLED device on or off
    speech:
      text: >-
        Nebula {{ 'on' if (power | default('') | string | lower) in ['on','true','1'] else 'off' }}.
    action:
      - service: script.nebula_apply
        data:
          power: "{{ power }}"
  NebulaEffect:
    speech:
      text: "Nebula effect set to {{ effect }}."
    action:
      - service: script.nebula_apply
        data:
          effect: "{{ effect }}"
  NebulaPalette:
    speech:
      text: "Nebula palette set to {{ palette }}."
    action:
      - service: script.nebula_apply
        data:
          palette: "{{ palette }}"
  NebulaSpeed:
    speech:
      text: "Nebula speed set to {{ speed | int }}."
    action:
      - service: script.nebula_apply
        data:
          speed: "{{ speed }}"
  NebulaDistortion:
    speech:
      text: "Nebula distortion set to {{ distortion | int }}."
    action:
      - service: script.nebula_apply
        data:
          distortion: "{{ distortion }}"
  NebulaScene:
    speech:
      text: >-
        Nebula updated{% if effect is defined and effect %} to {{ effect }}{% endif %}{% if speed is defined and speed != '' %}, speed {{ speed | int }}{% endif %}{% if distortion is defined and distortion != '' %}, distortion {{ distortion | int }}{% endif %}.
    action:
      - service: script.nebula_apply
        data:
          effect: "{{ effect | default('', true) }}"
          speed: "{{ speed | default('', true) }}"
          distortion: "{{ distortion | default('', true) }}"
