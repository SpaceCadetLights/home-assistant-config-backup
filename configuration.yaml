# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

homeassistant:
  packages: !include_dir_named packages

# LaunchPad Music Assistant playlist helpers (add-to-playlist voice + UI)
launchpad_music:

# Added By Homeway to enable Alexa support.
alexa:
  smart_home:

# Added By Homeway to enable Google Assistant support.
google_assistant:
  project_id: homewayio
  service_account:
    private_key: "nokey"
    client_email: "support@homeway.io"

# Added By Homeway to enable proper HTTP proxy support.
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.30.32.0/23
    - 127.0.0.1
    - ::1

# Added by Homeway to enable webrtc video streaming. Prevent Homeway from updating web_rtc by setting following to false: homeway_auto_update:true
web_rtc:
  ice_servers:
    - url:
        - "stun:stun.cloudflare.com:3478"
        - "stun:stun.cloudflare.com:53"
        - "stun:webrtc.homeway.io:443"
    - url:
        - "turn:webrtc.homeway.io:443?transport=udp"
        - "turn:webrtc.homeway.io:3478?transport=udp"
        - "turn:webrtc.homeway.io:3478?transport=tcp"
        - "turn:webrtc.homeway.io:80?transport=tcp"
        - "turns:webrtc.homeway.io:443?transport=tcp"
        - "turns:webrtc.homeway.io:5349?transport=tcp"
      username: "UUO7QRHI72BH91H24FEH3SJXR65XM4OFBQK6VLTCVSWWU1WAOCHG70GYH9P5-1"
      credential: "583303CE72274A0BF0575A822BD9A3450A9F4E3E3E0D44D987898599BED4F2D3"
# Location / history retention — keep forever (Space Cadets trails + general history).
# Daily GPS also archived under www/spacecadets/location-history/ (see packages/location_archive.yaml).
recorder:
  purge_keep_days: 99999
  auto_purge: true

# added by isaac for blinds control

rest_command:
  sinric_blinds_open:
    url: "https://apple.sinric.pro/v1/shortcuts/actions"
    method: POST
    headers:
      Content-Type: "application/json"
    payload: >
      {
        "api_key": "57c863f7-0334-440e-ba9e-8843ed3b17e5",
        "device_id": "67de1f40947cbabd20e2734f",
        "action": "setPowerState",
        "value": {
          "state": "On"
        }
      }

  sinric_blinds_close:
    url: "https://apple.sinric.pro/v1/shortcuts/actions"
    method: POST
    headers:
      Content-Type: "application/json"
    payload: >
      {
        "api_key": "57c863f7-0334-440e-ba9e-8843ed3b17e5",
        "device_id": "67de1f40947cbabd20e2734f",
        "action": "setPowerState",
        "value": {
          "state": "Off"
        }
      }

# Sinric gives no state feedback, so track the blinds' state from the last
# command via a persistent helper -> the cover always shows open/closed.
input_boolean:
  smart_blinds_open:
    name: Smart Blinds Open
    icon: mdi:blinds

template:
  - cover:
      - name: "Smart Blinds"
        unique_id: sinric_smart_blinds
        device_class: blind
        state: "{{ 'open' if is_state('input_boolean.smart_blinds_open', 'on') else 'closed' }}"

        open_cover:
          - action: rest_command.sinric_blinds_open
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.smart_blinds_open

        close_cover:
          - action: rest_command.sinric_blinds_close
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.smart_blinds_open

        stop_cover:
          - action: rest_command.sinric_blinds_close
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.smart_blinds_open
