# Space Cadets — Nebula voice control
# "Nebula" is the branded name for our WLED lighting. The active device is
# whatever Space Cadets selected (input_text.nebula_target). Power + advanced
# params route through script.nebula_apply so voice always follows the picker.
language: "en"
lists:
  effect:
    wildcard: true
  palette:
    wildcard: true
  speed:
    range:
      from: 0
      to: 255
  distortion:
    range:
      from: 0
      to: 255
intents:
  NebulaPower:
    data:
      - sentences:
          - "(turn|switch|set) [the] nebula [light] on"
          - "nebula [light] on"
          - "turn on [the] nebula [light]"
        slots:
          power: "on"
      - sentences:
          - "(turn|switch|set) [the] nebula [light] off"
          - "nebula [light] off"
          - "turn off [the] nebula [light]"
        slots:
          power: "off"
  NebulaEffect:
    data:
      - sentences:
          - "(set|change|make|switch|turn) [the] nebula [light] [to] [turn] [to] effect [to] {effect}"
          - "nebula [light] effect [to] {effect}"
  NebulaPalette:
    data:
      - sentences:
          - "(set|change|make|switch) [the] nebula [light] [to] palette [to] {palette}"
          - "nebula [light] palette [to] {palette}"
  NebulaSpeed:
    data:
      - sentences:
          - "(set|change|make) [the] nebula [light] speed [to] {speed}"
          - "nebula [light] speed [to] {speed}"
  NebulaDistortion:
    data:
      - sentences:
          - "(set|change|make) [the] nebula [light] distortion [to] {distortion}"
          - "nebula [light] distortion [to] {distortion}"
  NebulaScene:
    data:
      - sentences:
          - "(set|change|make|switch|turn) [the] nebula [light] [to] [turn] [to] effect {effect} [and] speed {speed} [and] distortion {distortion}"
          - "(set|change|make|switch|turn) [the] nebula [light] [to] [turn] [to] effect {effect} [and] speed {speed}"
          - "(set|change|make|switch|turn) [the] nebula [light] [to] [turn] [to] effect {effect} [and] distortion {distortion}"
          - "(set|change|make|switch|turn) [the] nebula [light] [to] speed {speed} [and] distortion {distortion}"
